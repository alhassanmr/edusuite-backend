server:
  port: 8080

spring:
  application:
    name: edusuite-backend

  profiles:
    active: dev

  jackson:
    default-property-inclusion: non_null

---
# ---------- DEV PROFILE: in-memory H2, zero setup ----------
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:edusuite;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true

app:
  jwt:
    secret: "dGhpc0lzQVNhbXBsZURldkpXVFNlY3JldEtleUZvckVkdVN1aXRlQXBwMjAyNg=="
    expiration-ms: 86400000
  cors:
    allowed-origins: "http://localhost:5173"
  notifications:
    sms:
      provider: log   # log | arkesel | twilio
      sender-id: EduSuite
    email:
      enabled: false  # true in prod with spring.mail configured
      from: no-reply@edusuite.app
  payments:
    platform-fee-percent: 1.0     # % of each payment kept by the platform
    paystack:
      secret-key: ""              # sk_test_xxx from dashboard.paystack.com
      callback-url: "http://localhost:5173/payment/callback"

---
# ---------- PROD PROFILE: PostgreSQL, env-driven ----------
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/edusuite}
    username: ${DB_USERNAME:edusuite}
    password: ${DB_PASSWORD:edusuite}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://app.hasfatempire.com}
  notifications:
    sms:
      provider: ${SMS_PROVIDER:log}          # arkesel for Ghana, twilio international
      api-key: ${SMS_API_KEY:}               # Arkesel API key
      sender-id: ${SMS_SENDER_ID:EduSuite}
      twilio:
        account-sid: ${TWILIO_ACCOUNT_SID:}
        auth-token: ${TWILIO_AUTH_TOKEN:}
        from-number: ${TWILIO_FROM_NUMBER:}
    email:
      enabled: ${EMAIL_ENABLED:false}
      from: ${EMAIL_FROM:no-reply@edusuite.app}
  payments:
    platform-fee-percent: ${PLATFORM_FEE_PERCENT:1.0}
    paystack:
      secret-key: ${PAYSTACK_SECRET_KEY:}
      callback-url: ${PAYSTACK_CALLBACK_URL:https://app.yourdomain.com/payment/callback}

spring.mail:
  host: ${SMTP_HOST:smtp.gmail.com}
  port: ${SMTP_PORT:587}
  username: ${SMTP_USERNAME:}
  password: ${SMTP_PASSWORD:}
  properties:
    mail:
      smtp:
        auth: true
        starttls:
          enable: true
